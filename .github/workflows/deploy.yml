name: Deploy to Pages

# Only a tag ships. The live site is a thing that was decided on, not
# whatever landed on main this afternoon.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        run: make check

      # The tag is the version and there is nowhere else it is written.
      # stage.py copies only what the site serves (its SERVED list is the
      # one place that is written down) into _site, and stamps the copy:
      # the cache name in sw.js, the version app.js prints, and ?v= on
      # the stylesheet and script tags so the edge's four-hour copy of
      # the last release is never served against this one's pages. Any
      # stamp that does not land exactly once fails the step before
      # anything is uploaded. Dispatched off a branch the version is the
      # branch name, which is honest and harmless. `make stage` rehearses
      # this on a laptop.
      - name: Stage and stamp
        run: python3 scripts/stage.py "$GITHUB_REF_NAME" _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # needs: deploy is the point. A release should only exist for something
  # that actually went live. There is no artifact to attach: the site is
  # the repo's served files, and the tag is the archive GitHub already
  # makes.
  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release view "$GITHUB_REF_NAME" --repo "$REPO" > /dev/null
